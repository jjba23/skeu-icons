<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>IntelliJ IDEA Xcode</title>
  <desc>Skeuomorphic icon: a chrome hammer with a navy enamelled handle, echoing Xcode's "build" hammer while keeping IntelliJ's IJ maker's mark. Free-standing object, no icon mask.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.07" stop-color="#f0f2f4"/>
      <stop offset="0.2" stop-color="#cfd4da"/>
      <stop offset="0.36" stop-color="#a8aeb6"/>
      <stop offset="0.52" stop-color="#ced3d9"/>
      <stop offset="0.68" stop-color="#f6f8fa"/>
      <stop offset="0.8" stop-color="#dfe3e8"/>
      <stop offset="0.93" stop-color="#a2a8b0"/>
      <stop offset="1" stop-color="#7d838b"/>
    </linearGradient>
    <linearGradient id="steelFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f767e"/>
      <stop offset="0.35" stop-color="#aab1b9"/>
      <stop offset="0.75" stop-color="#d9dde2"/>
      <stop offset="1" stop-color="#eef1f4"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7796bf"/>
      <stop offset="0.1" stop-color="#4c6d97"/>
      <stop offset="0.34" stop-color="#22334a"/>
      <stop offset="0.62" stop-color="#101a26"/>
      <stop offset="0.86" stop-color="#0a121b"/>
      <stop offset="1" stop-color="#1d2c3c"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e3ad"/>
      <stop offset="0.28" stop-color="#dcb268"/>
      <stop offset="0.62" stop-color="#b78a3e"/>
      <stop offset="0.85" stop-color="#8f6828"/>
      <stop offset="1" stop-color="#c9a256"/>
    </linearGradient>
    <linearGradient id="headFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f969e" stop-opacity="0"/>
      <stop offset="1" stop-color="#7c838b" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#bcd6f5"/>
    </linearGradient>
    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="17"/>
      <feOffset dy="18" result="o"/>
      <feFlood flood-color="#0a1220" flood-opacity="0.5"/>
      <feComposite in2="o" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="headClip">
      <rect x="-180" y="-132" width="200" height="264" rx="24"/>
    </clipPath>
    <clipPath id="handleClip">
      <path d="M 6,-46 L 520,-38 C 556,-36 570,-20 570,0 C 570,20 556,36 520,38 L 6,46 Z"/>
    </clipPath>
  </defs>

  <g transform="translate(407.2,430.1) rotate(38)">
    <g filter="url(#dropShadow)">
      <!-- enamelled handle -->
      <path d="M 6,-46 L 520,-38 C 556,-36 570,-20 570,0 C 570,20 556,36 520,38 L 6,46 Z" fill="url(#handle)"/>
      <g clip-path="url(#handleClip)">
        <path d="M 20,-32 L 500,-26" stroke="#a9c4e4" stroke-width="9" opacity="0.45" stroke-linecap="round"/>
        <path d="M 20,-40 L 500,-34" stroke="#ffffff" stroke-width="3" opacity="0.35" stroke-linecap="round"/>
        <path d="M 20,30 L 512,26" stroke="#000000" stroke-width="14" opacity="0.4" filter="url(#soft)"/>
        <ellipse cx="290" cy="-26" rx="180" ry="12" fill="#ffffff" opacity="0.15" filter="url(#soft)"/>
      </g>

      <!-- brass maker's plate -->
      <rect x="300" y="-27" width="196" height="54" rx="9" fill="url(#brass)"/>
      <rect x="300" y="-27" width="196" height="54" rx="9" fill="none" stroke="#6d4f1c" stroke-width="2" opacity="0.6"/>
      <rect x="304" y="-23" width="188" height="46" rx="6" fill="none" stroke="#fff6d8" stroke-width="2" opacity="0.5"/>
      <g fill="#6b4d1b">
        <circle cx="315" cy="-15" r="5"/>
        <circle cx="481" cy="-15" r="5"/>
        <circle cx="315" cy="15" r="5"/>
        <circle cx="481" cy="15" r="5"/>
      </g>
      <g fill="#ffeec2" opacity="0.85">
        <circle cx="314" cy="-17" r="2.2"/>
        <circle cx="480" cy="-17" r="2.2"/>
        <circle cx="314" cy="13" r="2.2"/>
        <circle cx="480" cy="13" r="2.2"/>
      </g>

      <!-- chrome collar where the handle enters the head -->
      <rect x="16" y="-58" width="42" height="116" rx="12" fill="url(#steel)"/>
      <rect x="16" y="-58" width="42" height="116" rx="12" fill="none" stroke="#6d747c" stroke-width="2.5" opacity="0.7"/>
      <path d="M 24,-52 L 24,52" stroke="#ffffff" stroke-width="6" opacity="0.75"/>
      <path d="M 48,-46 L 48,46" stroke="#000000" stroke-width="5" opacity="0.3"/>

      <!-- chrome head -->
      <rect x="-180" y="-132" width="200" height="264" rx="24" fill="url(#steel)"/>
      <g clip-path="url(#headClip)">
        <!-- striking face (turned away from the viewer) -->
        <rect x="-180" y="-140" width="46" height="280" fill="url(#steelFace)"/>
        <rect x="-134" y="-140" width="6" height="280" fill="#5f666d" opacity="0.45"/>
        <!-- machined chamfers -->
        <path d="M -180,-116 L 4,-116" stroke="#ffffff" stroke-width="12" opacity="0.5" filter="url(#soft)"/>
        <path d="M -180,118 L 4,118" stroke="#000000" stroke-width="16" opacity="0.35" filter="url(#soft)"/>
        <path d="M -172,-124 L -172,124" stroke="#ffffff" stroke-width="7" opacity="0.3" filter="url(#soft)"/>
        <ellipse cx="-60" cy="-70" rx="120" ry="34" fill="#ffffff" opacity="0.28" filter="url(#soft)"/>
        <rect x="-180" y="40" width="200" height="96" fill="url(#headFloor)"/>
      </g>
      <rect x="-180" y="-132" width="200" height="264" rx="24" fill="none" stroke="#787f87" stroke-width="3" opacity="0.85"/>
      <rect x="-176" y="-128" width="192" height="256" rx="20" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.55"/>

      <!-- engraved IJ maker's mark -->
      <g transform="translate(20,0)">
        <g fill="#ffffff" opacity="0.5" transform="translate(0,5)">
          <rect x="-134" y="-64" width="24" height="128" rx="3"/>
          <rect x="-82" y="-64" width="24" height="104" rx="3"/>
          <path d="M -70,30 L -70,54 C -70,82 -92,96 -122,96" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
        </g>
        <g fill="#1b2b3f">
          <rect x="-134" y="-64" width="24" height="128" rx="3"/>
          <rect x="-82" y="-64" width="24" height="104" rx="3"/>
          <path d="M -70,30 L -70,54 C -70,82 -92,96 -122,96" fill="none" stroke="#1b2b3f" stroke-width="24" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- impact spark -->
    <g>
      <path d="M -236,-56 Q -229,-7 -182,0 Q -229,7 -236,56 Q -243,7 -290,0 Q -243,-7 -236,-56 Z"
            fill="#d8e8ff" opacity="0.55" filter="url(#glow)"/>
      <path d="M -236,-56 Q -229,-7 -182,0 Q -229,7 -236,56 Q -243,7 -290,0 Q -243,-7 -236,-56 Z"
            fill="url(#spark)" opacity="0.92"/>
    </g>
  </g>
</svg>
