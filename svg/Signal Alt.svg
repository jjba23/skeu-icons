<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Signal Alt</title>
  <desc>Skeuomorphic icon: a glossy Signal-blue enamelled speech bubble carrying the stitched dashed outline of the classic Signal mark. Alt variant: same construction, different materials.</desc>
  <defs>
    <radialGradient id="bubbleFace" cx="0.36" cy="0.14" r="1.08">
      <stop offset="0" stop-color="#a5bcd8"/>
      <stop offset="0.26" stop-color="#637e9f"/>
      <stop offset="0.5" stop-color="#354a66"/>
      <stop offset="0.74" stop-color="#1d2b3e"/>
      <stop offset="1" stop-color="#0b1320"/>
    </radialGradient>
    <linearGradient id="bubbleShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#000a18" stop-opacity="0"/>
      <stop offset="0.76" stop-color="#000a18" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#00050d" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.52" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.86" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.28" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="0.64" stop-color="#000814" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00060e" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="ambient" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="contact" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="stitchShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="3" result="o"/>
      <feFlood flood-color="#020a16" flood-opacity="0.6"/>
      <feComposite in2="o" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="bubblePath" d="M 408,236 L 616,236 A 170,170 0 0 1 786,406 L 786,496 A 170,170 0 0 1 616,666 L 572,666 C 542,722 478,772 398,806 C 385,811 373,796 382,783 C 410,732 426,694 438,666 L 408,666 A 170,170 0 0 1 238,496 L 238,406 A 170,170 0 0 1 408,236 Z"/>
    <clipPath id="bubbleClip">
      <use xlink:href="#bubblePath"/>
    </clipPath>
  </defs>

  <g transform="translate(512,506) scale(1.12) translate(-512,-506)">
  <!-- cast shadow -->
  <use xlink:href="#bubblePath" transform="translate(0,26)" fill="#000000" opacity="0.32" filter="url(#ambient)"/>
  <use xlink:href="#bubblePath" transform="translate(0,10)" fill="#000000" opacity="0.36" filter="url(#contact)"/>

  <!-- enamelled speech bubble -->
  <use xlink:href="#bubblePath" fill="url(#bubbleFace)"/>
  <g clip-path="url(#bubbleClip)">
    <use xlink:href="#bubblePath" fill="url(#bubbleShade)"/>
    <path d="M 238,320 A 170,170 0 0 1 408,236 L 616,236 A 170,170 0 0 1 786,320 L 786,436 Q 512,516 238,436 Z" fill="url(#gloss)" filter="url(#soft)"/>
    <ellipse cx="420" cy="298" rx="196" ry="66" fill="#ffffff" opacity="0.24" filter="url(#soft)"/>
    <path d="M 300,700 C 360,742 452,712 520,660" fill="none" stroke="#ffffff" stroke-width="9" opacity="0.12" filter="url(#soft)"/>
  </g>
  <use xlink:href="#bubblePath" fill="none" stroke="url(#bevel)" stroke-width="9"/>

  <!-- stitched outline of the classic Signal mark -->
  <g filter="url(#stitchShadow)" opacity="0.9">
    <g transform="translate(74.4,65.1) scale(0.858)">
      <rect x="238" y="236" width="548" height="430" rx="170" fill="none"
            stroke="#cfdcec" stroke-width="17" stroke-dasharray="28 26" stroke-linecap="round"/>
    </g>
  </g>
  </g>
</svg>
