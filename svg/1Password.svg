<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>1Password</title>
  <desc>Skeuomorphic icon: a chrome-and-blue-enamel padlock with a white keyhole, the 1Password mark.</desc>
  <defs>
    <linearGradient id="shackle" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#e8e8e8"/>
      <stop offset="0.4" stop-color="#b9b9b9"/>
      <stop offset="0.62" stop-color="#8d8d8d"/>
      <stop offset="0.8" stop-color="#cfcfcf"/>
      <stop offset="1" stop-color="#7d7d7d"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfb"/>
      <stop offset="0.08" stop-color="#e4e4e4"/>
      <stop offset="0.3" stop-color="#b4b4b4"/>
      <stop offset="0.55" stop-color="#9a9a9a"/>
      <stop offset="0.78" stop-color="#d6d6d6"/>
      <stop offset="0.92" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a2a2a2"/>
    </linearGradient>
    <radialGradient id="enamel" cx="0.36" cy="0.18" r="1.05">
      <stop offset="0" stop-color="#a2c9f6"/>
      <stop offset="0.24" stop-color="#5f9dea"/>
      <stop offset="0.46" stop-color="#2f74d8"/>
      <stop offset="0.68" stop-color="#1c55b3"/>
      <stop offset="0.86" stop-color="#123f8d"/>
      <stop offset="1" stop-color="#0a2c66"/>
    </radialGradient>
    <linearGradient id="faceShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#001a4a" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#001a4a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#000e2e" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.86" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="keyholeGrad" gradientUnits="userSpaceOnUse" x1="0" y1="536" x2="0" y2="748">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#f7fafd"/>
      <stop offset="1" stop-color="#cbd9ea"/>
    </linearGradient>
    <filter id="ambient" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="contact" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="dropShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11"/>
      <feOffset dy="13" result="o"/>
      <feFlood flood-color="#04122c" flood-opacity="0.5"/>
      <feComposite in2="o" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="bodyClip">
      <rect x="282" y="442" width="460" height="380" rx="84"/>
    </clipPath>
  </defs>

  <g transform="translate(512,510) scale(1.14) translate(-512,-510)">
  <!-- ground shadow -->
  <ellipse cx="512" cy="872" rx="300" ry="54" fill="#000000" opacity="0.3" filter="url(#ambient)"/>
  <ellipse cx="512" cy="848" rx="262" ry="30" fill="#000000" opacity="0.42" filter="url(#contact)"/>

  <!-- shackle -->
  <g filter="url(#dropShadow)">
    <path d="M 372,452 L 372,356 A 140,140 0 0 1 652,356 L 652,452" fill="none" stroke="#4a4a4a" stroke-width="76" opacity="0.85"/>
    <path d="M 372,452 L 372,356 A 140,140 0 0 1 652,356 L 652,452" fill="none" stroke="url(#shackle)" stroke-width="66"/>
    <path d="M 388,412 L 388,358 A 124,124 0 0 1 470,240" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <path d="M 636,412 L 636,358 A 124,124 0 0 1 590,252" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- padlock body: chrome frame -->
  <rect x="252" y="412" width="520" height="440" rx="104" fill="url(#frame)"/>
  <rect x="252" y="412" width="520" height="440" rx="104" fill="none" stroke="#6f6f6f" stroke-width="2.5" opacity="0.65"/>
  <rect x="258" y="418" width="508" height="428" rx="98" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.75"/>
  <rect x="276" y="436" width="472" height="392" rx="88" fill="none" stroke="#5c5c5c" stroke-width="4" opacity="0.45"/>

  <!-- enamelled face -->
  <rect x="282" y="442" width="460" height="380" rx="84" fill="url(#enamel)"/>
  <g clip-path="url(#bodyClip)">
    <rect x="282" y="442" width="460" height="380" rx="84" fill="url(#faceShade)"/>
    <path d="M 282,528 A 84,84 0 0 1 366,442 L 658,442 A 84,84 0 0 1 742,528 L 742,606 Q 512,676 282,606 Z" fill="url(#gloss)" filter="url(#soft)"/>
    <ellipse cx="424" cy="508" rx="160" ry="60" fill="#ffffff" opacity="0.22" filter="url(#soft)"/>
    <rect x="282" y="442" width="460" height="380" rx="84" fill="none" stroke="#06183c" stroke-width="12" opacity="0.35" filter="url(#soft)"/>
  </g>

  <!-- white keyhole -->
  <g filter="url(#dropShadow)">
    <circle cx="512" cy="600" r="64" fill="url(#keyholeGrad)"/>
    <path fill="url(#keyholeGrad)" d="M 488,642 L 464,714 A 26,26 0 0 0 489,746 L 535,746 A 26,26 0 0 0 560,714 L 536,642 Z"/>
  </g>
  <path d="M 472,582 A 42,42 0 0 1 520,552" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.75" stroke-linecap="round"/>
  </g>
</svg>
