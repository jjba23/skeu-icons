<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>WhatsApp</title>
  <desc>Skeuomorphic icon: a chrome-rimmed green enamel badge with a glossy white speech bubble and the classic green handset. Handset geometry from the official WhatsApp mark.</desc>
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.04" stop-color="#f4f4f4"/>
      <stop offset="0.14" stop-color="#d4d4d4"/>
      <stop offset="0.3" stop-color="#a8a8a8"/>
      <stop offset="0.44" stop-color="#c2c2c2"/>
      <stop offset="0.56" stop-color="#e6e6e6"/>
      <stop offset="0.72" stop-color="#ffffff"/>
      <stop offset="0.84" stop-color="#e2e2e2"/>
      <stop offset="1" stop-color="#9d9d9d"/>
    </linearGradient>
    <radialGradient id="face" cx="0.36" cy="0.2" r="1.02">
      <stop offset="0" stop-color="#b6f5cf"/>
      <stop offset="0.24" stop-color="#6ee6a0"/>
      <stop offset="0.46" stop-color="#2fd473"/>
      <stop offset="0.68" stop-color="#14ac55"/>
      <stop offset="0.86" stop-color="#0a8543"/>
      <stop offset="1" stop-color="#055a2c"/>
    </radialGradient>
    <linearGradient id="faceShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#00331a" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#00331a" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#001f10" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="0.78" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f9fdfa"/>
      <stop offset="1" stop-color="#dcf2e3"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#41e287"/>
      <stop offset="0.45" stop-color="#22ce62"/>
      <stop offset="1" stop-color="#0b7538"/>
    </linearGradient>
    <filter id="ambient" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="contact" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="bubbleShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="12" result="o"/>
      <feFlood flood-color="#023018" flood-opacity="0.5"/>
      <feComposite in2="o" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="phoneShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="5" result="o"/>
      <feFlood flood-color="#05371d" flood-opacity="0.38"/>
      <feComposite in2="o" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="faceClip">
      <circle cx="512" cy="512" r="418"/>
    </clipPath>
    <path id="bubblePath" d="M 404,292 L 620,292 A 118,118 0 0 1 738,410 L 738,548 A 118,118 0 0 1 620,666 L 570,666 C 542,716 480,760 400,792 C 387,797 376,783 384,770 C 410,722 424,688 434,666 L 404,666 A 118,118 0 0 1 286,548 L 286,410 A 118,118 0 0 1 404,292 Z"/>
    <clipPath id="bubbleClip">
      <use xlink:href="#bubblePath"/>
    </clipPath>
  </defs>

  <!-- cast shadows -->
  <ellipse cx="512" cy="546" rx="446" ry="440" fill="#000000" opacity="0.3" filter="url(#ambient)"/>
  <ellipse cx="512" cy="528" rx="452" ry="446" fill="#000000" opacity="0.35" filter="url(#contact)"/>

  <!-- chrome rim -->
  <circle cx="512" cy="512" r="470" fill="url(#rim)"/>
  <circle cx="512" cy="512" r="469" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.9"/>
  <circle cx="512" cy="512" r="470" fill="none" stroke="#585858" stroke-width="3" opacity="0.6"/>
  <path d="M 118,352 A 434,434 0 0 1 430,86" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <path d="M 906,672 A 434,434 0 0 1 694,914" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <circle cx="512" cy="512" r="447" fill="none" stroke="#3f3f3f" stroke-width="4" opacity="0.28"/>
  <circle cx="512" cy="512" r="424" fill="none" stroke="#022415" stroke-width="10" opacity="0.42" filter="url(#soft)"/>

  <!-- enamel face -->
  <circle cx="512" cy="512" r="418" fill="url(#face)"/>
  <circle cx="512" cy="512" r="418" fill="url(#faceShade)"/>
  <g clip-path="url(#faceClip)">
    <path d="M 78,512 A 434,434 0 0 1 946,512 Z" fill="url(#gloss)" filter="url(#soft)"/>
    <ellipse cx="512" cy="252" rx="300" ry="112" fill="#ffffff" opacity="0.26" filter="url(#soft)"/>
    <path d="M 100,606 A 418,418 0 0 0 924,606" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.16" filter="url(#soft)"/>
    <circle cx="512" cy="512" r="412" fill="none" stroke="#01230f" stroke-width="16" opacity="0.34" filter="url(#soft)"/>
  </g>

  <!-- white speech bubble -->
  <use xlink:href="#bubblePath" fill="url(#bubble)" filter="url(#bubbleShadow)"/>
  <g clip-path="url(#bubbleClip)">
    <path d="M 286,376 A 118,118 0 0 1 404,292 L 620,292 A 118,118 0 0 1 738,376 L 738,420 Q 512,486 286,420 Z" fill="#ffffff" opacity="0.75" filter="url(#soft)"/>
    <path d="M 286,560 C 380,606 640,606 738,556 L 738,666 L 286,666 Z" fill="#a8d9bd" opacity="0.22" filter="url(#soft)"/>
  </g>
  <use xlink:href="#bubblePath" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.55"/>

  <!-- classic green handset (geometry from the official WhatsApp mark) -->
  <g transform="translate(321.7,268.6) scale(1.12)" filter="url(#phoneShadow)">
    <path fill="url(#phone)" d="M262.475 216.777C257.997 214.534 235.978 203.704 231.869 202.209C227.761 200.713 224.779 199.966 221.796 204.452C218.814 208.939 210.228 219.029 207.615 222.011C205.002 225.002 202.389 225.372 197.911 223.128C193.434 220.885 179.003 216.158 161.891 200.902C148.578 189.024 139.587 174.362 136.975 169.875C134.362 165.389 136.7 162.965 138.934 160.739C140.945 158.728 143.412 155.505 145.655 152.892C147.899 150.279 148.638 148.406 150.133 145.423C151.629 142.432 150.881 139.82 149.764 137.576C148.646 135.333 139.691 113.287 135.952 104.323C132.316 95.5909 128.621 96.777 125.879 96.6309C123.266 96.5019 120.284 96.4762 117.293 96.4762C114.302 96.4762 109.454 97.5935 105.346 102.08C101.238 106.566 89.6691 117.404 89.6691 139.441C89.6691 161.478 105.716 182.785 107.959 185.776C110.202 188.767 139.544 234.001 184.469 253.408C195.153 258.023 203.498 260.782 210.004 262.845C220.731 266.257 230.494 265.776 238.212 264.624C246.816 263.335 264.71 253.786 268.44 243.326C272.17 232.866 272.17 223.893 271.053 222.028C269.936 220.163 266.945 219.037 262.467 216.794L262.475 216.777Z"/>
  </g>
</svg>
