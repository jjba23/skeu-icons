<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Emacs</title>
  <desc>Skeuomorphic icon: chrome-rimmed purple enamel badge with the white GNU Emacs script "E".</desc>
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.04" stop-color="#f4f4f4"/>
      <stop offset="0.14" stop-color="#d4d4d4"/>
      <stop offset="0.3" stop-color="#a8a8a8"/>
      <stop offset="0.44" stop-color="#c2c2c2"/>
      <stop offset="0.56" stop-color="#e6e6e6"/>
      <stop offset="0.72" stop-color="#ffffff"/>
      <stop offset="0.84" stop-color="#e2e2e2"/>
      <stop offset="1" stop-color="#9d9d9d"/>
    </linearGradient>
    <radialGradient id="face" cx="0.36" cy="0.2" r="1.02">
      <stop offset="0" stop-color="#c3aef1"/>
      <stop offset="0.24" stop-color="#9d74dd"/>
      <stop offset="0.46" stop-color="#7c42c2"/>
      <stop offset="0.68" stop-color="#5f27a0"/>
      <stop offset="0.86" stop-color="#471a7d"/>
      <stop offset="1" stop-color="#331055"/>
    </radialGradient>
    <linearGradient id="faceShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#2a1046" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#2a1046" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#1d0634" stop-opacity="0.66"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="0.78" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#fdfbff"/>
      <stop offset="1" stop-color="#e4dcf6"/>
    </linearGradient>
    <filter id="ambient" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="contact" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glyphShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="7" result="o"/>
      <feFlood flood-color="#2b0d4a" flood-opacity="0.45"/>
      <feComposite in2="o" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="faceClip">
      <circle cx="512" cy="512" r="418"/>
    </clipPath>
  </defs>

  <!-- cast shadows -->
  <ellipse cx="512" cy="546" rx="446" ry="440" fill="#000000" opacity="0.3" filter="url(#ambient)"/>
  <ellipse cx="512" cy="528" rx="452" ry="446" fill="#000000" opacity="0.35" filter="url(#contact)"/>

  <!-- chrome rim -->
  <circle cx="512" cy="512" r="470" fill="url(#rim)"/>
  <circle cx="512" cy="512" r="469" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.9"/>
  <circle cx="512" cy="512" r="470" fill="none" stroke="#585858" stroke-width="3" opacity="0.6"/>
  <!-- specular arcs on the rim -->
  <path d="M 118,352 A 434,434 0 0 1 430,86" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <path d="M 906,672 A 434,434 0 0 1 694,914" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <circle cx="512" cy="512" r="447" fill="none" stroke="#3f3f3f" stroke-width="4" opacity="0.28"/>
  <circle cx="512" cy="512" r="424" fill="none" stroke="#241033" stroke-width="10" opacity="0.42" filter="url(#soft)"/>

  <!-- enamel face -->
  <circle cx="512" cy="512" r="418" fill="url(#face)"/>
  <circle cx="512" cy="512" r="418" fill="url(#faceShade)"/>
  <g clip-path="url(#faceClip)">
    <path d="M 78,512 A 434,434 0 0 1 946,512 Z" fill="url(#gloss)" filter="url(#soft)"/>
    <ellipse cx="512" cy="252" rx="300" ry="112" fill="#ffffff" opacity="0.26" filter="url(#soft)"/>
    <path d="M 100,606 A 418,418 0 0 0 924,606" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.16" filter="url(#soft)"/>
    <circle cx="512" cy="512" r="412" fill="none" stroke="#1c0733" stroke-width="16" opacity="0.38" filter="url(#soft)"/>
  </g>

  <!-- the Emacs script E (geometry from the GNU Emacs logo, GPLv3+, Nicolas Petton) -->
  <g transform="translate(96.97,83.75) scale(1.6953125)" filter="url(#glyphShadow)">
    <path fill="url(#glyph)" fill-rule="evenodd" d="m 175.0003,422.31057 c 0,0 19.7385,1.39634 45.1312,-0.84159 10.2834,-0.9063 49.3267,-4.74128 78.5169,-11.14289 0,0 35.5899,-7.61669 54.6301,-14.63335 19.9225,-7.34185 30.7636,-13.57304 35.6433,-22.40243 -0.2128,-1.80907 1.5024,-8.22438 -7.685,-12.07788 -23.4887,-9.85199 -50.73,-8.06998 -104.6338,-9.21285 -59.7772,-2.05391 -79.6627,-12.05971 -90.2556,-20.11838 -10.1579,-8.17519 -5.05,-30.79254 38.4742,-50.71499 21.9244,-10.60898 107.8705,-30.18698 107.8705,-30.18698 -28.9451,-14.30725 -82.9186,-39.45893 -94.0134,-44.89023 -9.7308,-4.76348 -25.303,-11.93595 -28.6785,-20.61368 -3.8271,-8.33089 9.0383,-15.50726 16.2248,-17.56236 23.1448,-6.67602 55.8182,-10.82538 85.5548,-11.29122 14.9472,-0.23417 17.3734,-1.19586 17.3734,-1.19586 20.6243,-3.42116 34.2014,-17.53175 28.5446,-39.87876 -5.0783,-22.81046 -31.8617,-36.21365 -57.3138,-31.57361 -23.9682,4.36956 -81.7378,21.15007 -81.7378,21.15007 71.4075,-0.61803 83.3592,0.57378 88.697,8.03676 3.1523,4.40742 -1.4324,10.45068 -20.4765,13.56099 -20.733,3.38616 -63.8312,7.46399 -63.8312,7.46399 -41.3449,2.4554 -70.4682,2.61974 -79.203,21.11314 -5.7065,12.08196 6.0854,22.7633 11.2538,29.4493 21.8407,24.28905 53.3882,37.38879 73.6948,47.03553 7.6405,3.62963 30.0586,10.48407 30.0586,10.48407 -65.8782,-3.62335 -113.4003,16.6055 -141.2764,39.89622 -31.5288,29.16261 -17.581403,63.92354 47.0124,85.3268 38.1517,12.6416 57.0725,18.58695 113.9815,13.46232 33.52,-1.80673 38.8041,-0.73155 39.1383,2.01892 0.4705,3.87242 -37.2311,13.49165 -47.524,16.4606 -26.1853,7.55306 -94.8276,22.80438 -95.1712,22.87835 z"/>
  </g>
</svg>
