<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>IntelliJ IDEA Alt</title>
  <desc>Skeuomorphic icon: a dark glass key-cap sitting on a brushed metal plinth, with the embossed white "IJ" of the JetBrains-era IntelliJ IDEA logo. Alt variant: same construction, different materials.</desc>
  <defs>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa0a7"/>
      <stop offset="0.06" stop-color="#828990"/>
      <stop offset="0.22" stop-color="#666d74"/>
      <stop offset="0.46" stop-color="#4b5259"/>
      <stop offset="0.62" stop-color="#71787f"/>
      <stop offset="0.8" stop-color="#969ca3"/>
      <stop offset="0.94" stop-color="#6b7279"/>
      <stop offset="1" stop-color="#454b52"/>
    </linearGradient>
    <linearGradient id="keyBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3ccd6"/>
      <stop offset="0.55" stop-color="#96a1ad"/>
      <stop offset="1" stop-color="#697480"/>
    </linearGradient>
    <linearGradient id="keyTop" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#fdfeff"/>
      <stop offset="0.3" stop-color="#e8eef4"/>
      <stop offset="0.62" stop-color="#c8d1db"/>
      <stop offset="0.88" stop-color="#9fabb8"/>
      <stop offset="1" stop-color="#8592a0"/>
    </linearGradient>
    <linearGradient id="glossKey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="innerRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#4b555f" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="glyphGrad" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="0" y2="690">
      <stop offset="0" stop-color="#22304a"/>
      <stop offset="0.68" stop-color="#1a2433"/>
      <stop offset="1" stop-color="#0e1724"/>
    </linearGradient>
    <filter id="ambient" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="glyphShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="5" result="o"/>
      <feFlood flood-color="#5d6771" flood-opacity="0.32"/>
      <feComposite in2="o" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="topClip">
      <rect x="176" y="268" width="672" height="428" rx="46"/>
    </clipPath>
  </defs>

  <!-- cast shadow of the plinth -->
  <rect x="96" y="272" width="832" height="580" rx="64" fill="#000000" opacity="0.35" filter="url(#ambient)"/>

  <!-- brushed metal plinth -->
  <rect x="80" y="216" width="864" height="600" rx="64" fill="url(#tray)"/>
  <rect x="80" y="216" width="864" height="600" rx="64" fill="none" stroke="#7d7d7d" stroke-width="2.5" opacity="0.7"/>
  <rect x="86" y="222" width="852" height="588" rx="60" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.6"/>
  <rect x="106" y="242" width="812" height="548" rx="50" fill="none" stroke="#6e6e6e" stroke-width="5" opacity="0.45"/>
  <rect x="110" y="246" width="804" height="540" rx="48" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35"/>

  <!-- key-cap body (extruded side walls) -->
  <rect x="176" y="268" width="672" height="490" rx="46" fill="url(#keyBody)"/>
  <rect x="176" y="268" width="672" height="490" rx="46" fill="none" stroke="#8a949e" stroke-width="2" opacity="0.8"/>
  <!-- contact shadow the key throws on the plinth -->
  <rect x="176" y="736" width="672" height="48" rx="36" fill="#000000" opacity="0.45" filter="url(#soft)"/>

  <!-- glass key-cap top -->
  <rect x="176" y="268" width="672" height="428" rx="46" fill="url(#keyTop)"/>
  <g clip-path="url(#topClip)">
    <path d="M 176,314 A 46,46 0 0 1 222,268 L 802,268 A 46,46 0 0 1 848,314 L 848,440 Q 512,522 176,440 Z" fill="url(#glossKey)" filter="url(#soft)"/>
    <ellipse cx="400" cy="304" rx="210" ry="56" fill="#ffffff" opacity="0.12" filter="url(#soft)"/>
  </g>
  <rect x="176" y="268" width="672" height="428" rx="46" fill="none" stroke="url(#innerRim)" stroke-width="6"/>
  <path d="M 224,270 L 800,270" stroke="#ffffff" stroke-width="3.5" opacity="0.7" stroke-linecap="round"/>
  <path d="M 200,692 Q 512,720 824,692" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.2"/>
  <path d="M 182,748 Q 512,776 842,748" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.32"/>
  <path d="M 176,758 Q 512,790 848,758" fill="none" stroke="#000000" stroke-width="6" opacity="0.35" filter="url(#soft)"/>

  <!-- IJ mark -->
  <g transform="translate(-11,-16)" filter="url(#glyphShadow)">
    <rect x="418" y="308" width="60" height="340" fill="url(#glyphGrad)"/>
    <rect x="568" y="308" width="60" height="260" fill="url(#glyphGrad)"/>
    <path d="M 598,566 L 598,596 C 598,640 570,664 536,664"
          fill="none" stroke="url(#glyphGrad)" stroke-width="60"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
